[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PustakaHadith"
version = "1.0"
description = "Perpustakaan digital hadis (Kutub al-Tis'ah) untuk desktop - carian, bacaan dan terjemahan."
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.11",
    "requests>=2.28.0",
    "pyperclip>=1.8.0",
    "tqdm>=4.65.0",
    "torch>=2.6",
    "sentence-transformers>=5.0",
    "faiss-cpu>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["api", "core", "ui", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
